# Exact environment pins for EHD-ResearchTests.
#
# GENERATED, never hand-edited. Regenerate with:
#
#     .\.venv\Scripts\python.exe -m pip freeze --all
#
# dropping the `-e ...#egg=ehdpsu` line and the `pip==` line (see the two omissions below), and
# sorting by lowercased PACKAGE NAME. The sort rule is part of the format: `Sort-Object` in
# PowerShell is culture-aware and ordered `mypy_extensions` before `mypy` on this machine, which
# would make the file regenerate differently on a machine with a different culture and produce
# diff noise indistinguishable from a real dependency change. `test_environment_lock.py` asserts
# the ordering.
#
# and re-run the Gate: tests/test_environment_lock.py compares this file against the installed
# environment and fails when they disagree. A lockfile nothing checks is a document that drifts
# from the thing it claims to describe -- *principle 5, specifications drift from implementations
# unless mechanically checked*.
#
# WHY THE DEV TOOLING IS PINNED HERE TOO
# --------------------------------------
# ruff, black, mypy, pyright and pytest are pinned in the same file as numpy and scipy, and that
# is deliberate. The Gate's verdict is a function of its tools: a ruff minor release adds lint
# rules, a mypy release tightens inference, a pyright release changes what it reports. Leaving
# them floating means the Gate can go red -- or green -- for reasons that have nothing to do with
# the code, which makes it useless as a regression signal.
#
# WHAT THIS FILE IS DEPENDED UPON FOR, AND WHAT IT IS NOT
# ------------------------------------------------------
# It pins VERSIONS. It does NOT pin artifact HASHES, so it does not defend against a compromised
# or re-uploaded PyPI artifact at a version already released. Hash pinning needs
# `pip install --require-hashes` and a hash-bearing lock, which `pip freeze` cannot emit; that is
# a further step, not something this file quietly provides. Stated here because a file named
# `.lock` invites the stronger assumption.
#
# TWO DELIBERATE OMISSIONS
# ------------------------
# `ehdpsu` -- the project itself. `pip freeze` emits it as
# `-e git+https://github.com/MACCRE-2026/EHD-ResearchTests.git@<commit>#egg=ehdpsu`, which would
# make a bootstrap clone the repository from GitHub at a frozen commit in order to install the
# working tree it is already sitting in. `bootstrap.ps1` installs it with `pip install -e .`
# instead.
#
# `pip` -- pinning it makes pip downgrade or upgrade itself partway through installing this file,
# which is a class of flakiness with no reproducibility benefit. The venv provides it.
#
# The versions below were captured on 2026-09-15 against Python 3.12.8 on Windows.
